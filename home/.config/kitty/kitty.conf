include current-theme.conf

enable_audio_bell no

font_family FiraCode Nerd Font
font_size 12

copy_on_select  yes

# Hints replace tmux-fastcopy, extrakto and tmux-fzf-url. They scan the whole
# visible window, so they see every zellij pane. Built in: ctrl+shift+e opens
# a URL; ctrl+shift+p then f/l/w/h inserts a path/line/word/hash at the prompt.
# ctrl+shift+y then a key copies the match to the clipboard instead.
map kitty_mod+y>u kitten hints --type url --program @
map kitty_mod+y>w kitten hints --type word --program @
map kitty_mod+y>p kitten hints --type path --program @
map kitty_mod+y>l kitten hints --type line --program @
map kitty_mod+y>h kitten hints --type hash --program @
map kitty_mod+y>i kitten hints --type ip --program @
